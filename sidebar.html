<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>PLaMo 翻訳</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #6e7781;
      --border: #d0d7de;
      --panel: #f6f8fa;
      --accent: #0969da;
      --accent-fg: #ffffff;
      --error: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c2128;
        --fg: #e6edf3;
        --muted: #9198a1;
        --border: #444c56;
        --panel: #22272e;
        --accent: #4493f8;
        --accent-fg: #ffffff;
        --error: #ff7b72;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    .langs {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 6px;
      align-items: center;
    }
    select, button, textarea {
      font: inherit;
      color: inherit;
    }
    select {
      width: 100%;
      min-width: 0;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
    }
    select:disabled { opacity: 1; color: var(--muted); }
    button {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      cursor: pointer;
    }
    button:hover { border-color: var(--muted); }
    button:disabled { cursor: default; opacity: 0.5; }
    button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    #swap { padding: 4px 8px; }
    .pane {
      flex: 1 1 0;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .pane:focus-within { border-color: var(--accent); }
    textarea, #output {
      flex: 1 1 auto;
      width: 100%;
      margin: 0;
      padding: 8px 10px;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
    }
    #output { background: var(--panel); }
    #output.placeholder, #output.loading { color: var(--muted); }
    #output.loading { font-style: italic; }
    #output.error { color: var(--error); }
    .bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .bar .spacer { flex: 1; }
    .bar button { font-size: 12px; padding: 2px 8px; }
    label.auto { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="langs">
    <select id="source" title="翻訳元の言語"></select>
    <button type="button" id="swap" title="翻訳の向きを入れ替える">⇄</button>
    <select id="target" title="翻訳先の言語"></select>
  </div>

  <div class="pane">
    <textarea id="input" placeholder="翻訳するテキストを入力 (Ctrl+Enter で翻訳)" spellcheck="false"></textarea>
    <div class="bar">
      <span id="count">0 文字</span>
      <span class="spacer"></span>
      <button type="button" id="clear" title="入力を消去">消去</button>
      <button type="button" id="translate" class="primary">翻訳</button>
    </div>
  </div>

  <div class="pane">
    <div id="output" class="placeholder" aria-live="polite">翻訳結果</div>
    <div class="bar">
      <label class="auto"><input type="checkbox" id="auto"> 入力中に自動翻訳</label>
      <span class="spacer"></span>
      <button type="button" id="copy" disabled>コピー</button>
    </div>
  </div>

  <script src="defaults.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
