<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>PLaMo Translator 設定</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 16px; min-width: 420px; }
    label { display: block; margin-bottom: 12px; }
    label span { display: block; font-weight: 600; margin-bottom: 2px; }
    input[type=text], input[type=url], select { width: 100%; box-sizing: border-box; padding: 4px 6px; }
    .hint { font-size: 12px; color: #6e7781; }
    .actions { display: flex; gap: 8px; align-items: center; }
    #status { font-size: 12px; }
    #status.error { color: #cf222e; }
  </style>
</head>
<body>
  <form id="form">
    <label>
      <span>エンドポイント URL</span>
      <input type="url" id="endpoint" required>
      <span class="hint">ollama のベース URL (/v1/chat/completions は自動付与)。既定: http://localhost:11434</span>
    </label>
    <label>
      <span>モデル名</span>
      <input type="text" id="model" required>
    </label>
    <label>
      <span>日本語の翻訳先言語</span>
      <input type="text" id="fromJaLang" list="langs" required>
      <datalist id="langs">
        <option value="en">英語</option>
        <option value="zh-hans">中国語 (簡体字)</option>
        <option value="zh-hant">中国語 (繁体字)</option>
        <option value="ko">韓国語</option>
        <option value="fr">フランス語</option>
        <option value="de">ドイツ語</option>
        <option value="es">スペイン語</option>
        <option value="it">イタリア語</option>
        <option value="pt">ポルトガル語</option>
        <option value="ru">ロシア語</option>
        <option value="vi">ベトナム語</option>
        <option value="th">タイ語</option>
        <option value="id">インドネシア語</option>
        <option value="ja(easy)">やさしい日本語</option>
      </datalist>
      <span class="hint">「日本語から〜へ翻訳」(Ctrl+Alt+E) の翻訳先。
        小文字の言語コード (例: en, ko, zh-hans)。</span>
    </label>
    <div class="actions">
      <button type="submit">保存</button>
      <button type="button" id="reset">既定値に戻す</button>
      <span id="status"></span>
    </div>
  </form>
  <script src="defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
